<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunos Welt">
<meta name="theme-color" content="#8FD3FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kunos Welt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Vollbild-3D-Welt. Runde Knöpfe schweben oben rechts, das Inventar liegt als Tablett unten. Spielwelt mit eigenem, festem Look (kein Dark Mode). */
:root{
  --ink:#1F2A37;
  --tray:rgba(255,251,242,.94);
  --tray-solid:#FFFBF2;
  --sun:#FFC21A;
  --sun-deep:#E8A400;
  --chip:#EFE6D2;
  --sky:#8FD3FF;
  --f-display:'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);}
body{font-family:var(--f-display);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
button{font-family:var(--f-display);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:3px solid var(--sun-deep);outline-offset:2px;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

#top{position:fixed;top:0;right:0;display:flex;gap:10px;z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) 0 12px;}
.rb{width:54px;height:54px;border-radius:50%;border:none;background:var(--tray-solid);display:grid;place-items:center;padding:0;
  box-shadow:0 3px 0 rgba(31,42,55,.14),0 8px 18px rgba(20,40,60,.18);transition:transform .12s;}
.rb:active{transform:translateY(2px) scale(.96);}
@media (max-width:520px){#top{gap:7px;padding-left:8px;padding-right:calc(env(safe-area-inset-right,0px) + 8px);}#top .rb{width:44px;height:44px;}#top .rb svg{width:23px;height:23px;}}
.rb svg{width:28px;height:28px;}

#inv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);z-index:4;box-sizing:border-box;
  background:var(--tray);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(20,40,60,.18);
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);}
#cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;touch-action:pan-x;}
#cats::-webkit-scrollbar,#items::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;height:44px;padding:0 16px 0 4px;border-radius:22px;border:none;background:var(--chip);
  display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px;letter-spacing:.01em;}
.cat img,.cat .ph{width:36px;height:36px;border-radius:50%;background:#fff;object-fit:contain;}
.cat.on{background:var(--sun);box-shadow:inset 0 -3px 0 var(--sun-deep);}
#row{display:flex;gap:10px;align-items:flex-start;}
#tools{display:flex;gap:8px;padding-right:10px;border-right:2px dashed #DCCCAB;flex:0 0 auto;}
#items{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;min-width:0;flex:1 1 auto;}
.it{flex:0 0 auto;width:74px;border:none;background:none;padding:2px 0 0;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-weight:600;font-size:12px;line-height:1.1;text-align:center;}
.ball{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,#FFFFFF,#F1E7D2 75%);
  box-shadow:inset 0 -4px 0 rgba(120,90,30,.10),0 2px 6px rgba(60,40,10,.10);transition:transform .15s,box-shadow .15s;}
.ball img{width:62px;height:62px;object-fit:contain;}
.ball svg{width:32px;height:32px;}
.it.on .ball{box-shadow:0 0 0 4px var(--sun),0 6px 14px rgba(232,164,0,.45);transform:scale(1.07);}
.it.nope .ball{animation:nope .35s;}
@keyframes nope{20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
@media (max-width:480px){
  .it{width:62px;font-size:11px}.ball{width:54px;height:54px}.ball img{width:52px;height:52px}
  .cat{height:40px;font-size:14px}.cat img,.cat .ph{width:32px;height:32px}
}

#editTray{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);z-index:4;box-sizing:border-box;
  background:var(--tray);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(20,40,60,.18);
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 10px);}
#editTop{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);}
#editTop>*{pointer-events:auto;}
#editTop .grp{display:flex;gap:10px;}
#editTop .pill{height:54px;}
#editItems{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;min-width:0;flex:1 1 auto;}
#editItems::-webkit-scrollbar{display:none;}
#pad{position:fixed;inset:0;z-index:3;touch-action:none;}
#joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;z-index:4;pointer-events:none;
  background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.75);box-shadow:0 4px 18px rgba(0,0,0,.18);}
#joy.rest{left:calc(env(safe-area-inset-left,0px) + 100px);top:calc(100% - env(safe-area-inset-bottom,0px) - 100px);}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--tray-solid);
  box-shadow:0 3px 0 rgba(31,42,55,.15),0 6px 12px rgba(0,0,0,.2);}
#walkBtns{position:fixed;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:12px;align-items:flex-end;
  padding:0 calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 22px) 0;}
.pill{height:62px;padding:0 22px 0 14px;border-radius:31px;border:none;background:var(--tray-solid);display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(31,42,55,.15),0 8px 18px rgba(20,40,60,.2);}
.pill svg{width:34px;height:34px;}
.pill.hot{background:var(--sun);box-shadow:inset 0 -4px 0 var(--sun-deep),0 8px 18px rgba(20,40,60,.2);}
.pill:active{transform:translateY(2px);}

#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);z-index:6;max-width:min(88vw,520px);
  background:rgba(31,42,55,.86);color:#FFFBF2;padding:10px 16px;border-radius:18px;font-weight:500;font-size:15px;line-height:1.35;text-align:center;
  transition:opacity .4s;pointer-events:none;}
#hint.off{opacity:0;}

#menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(15,25,40,.35);padding-inline:16px;}
#menuCard{background:var(--tray-solid);border-radius:26px;padding:18px;width:min(100%,540px);max-height:86vh;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);touch-action:pan-y;-webkit-overflow-scrolling:touch;}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mh .rb{width:44px;height:44px;box-shadow:none;background:var(--chip);}
.mh .rb svg{width:22px;height:22px;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mrow .mb{font-size:14px;}
#worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.wc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 0 rgba(31,42,55,.08),0 4px 12px rgba(31,42,55,.08);display:flex;flex-direction:column;min-width:0;}
.wc.cur{box-shadow:0 0 0 3px var(--sun),0 4px 12px rgba(232,164,0,.3);}
.wc .shot{border:none;padding:0;background:#BFE6FF;aspect-ratio:8/5;width:100%;max-width:100%;display:block;position:relative;}
.wc .shot img{width:100%;height:100%;object-fit:cover;display:block;}
.wc .tag{position:absolute;left:8px;top:8px;background:var(--sun);font-weight:700;font-size:11px;padding:3px 8px;border-radius:10px;letter-spacing:.03em;}
.wc .foot{display:flex;align-items:center;gap:4px;padding:6px 6px 8px 10px;min-width:0;}
.wc .nm{flex:1 1 auto;min-width:0;}
.wc .nm b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:15px;line-height:1.15;overflow-wrap:anywhere;}
.wc .nm small{display:block;font-size:11px;color:#6A7280;font-variant-numeric:tabular-nums;}
.wc .ib{width:34px;height:34px;border-radius:50%;border:none;background:var(--chip);display:grid;place-items:center;padding:0;flex:0 0 auto;}
.wc .ib svg{width:17px;height:17px;}
.wc input{-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box;font:600 15px var(--f-display);border:2px solid var(--sun);border-radius:10px;padding:4px 6px;color:var(--ink);background:#fff;}
.wc .ask{display:flex;flex-direction:column;gap:6px;padding:8px;}
.wc .ask p{margin:0;font-weight:600;font-size:14px;color:var(--ink);}
.wc .ask .mb{height:40px;font-size:14px;}
#worlds .empty{grid-column:1/-1;margin:0;padding:14px;border:2px dashed #DCCCAB;border-radius:16px;text-align:center;}
#menuCard h2{margin:0 0 4px;font-size:24px;font-weight:700;text-wrap:balance;}
#menuCard p{margin:0 0 6px;font-size:14px;line-height:1.4;color:#4A5563;}
.mb{height:52px;border:none;border-radius:16px;background:var(--chip);font-weight:600;font-size:16px;}
.mb.go{background:var(--sun);box-shadow:inset 0 -3px 0 var(--sun-deep);}
.mb.warn{background:#F7C6C0;}
#travel{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#2B4C8C,#0D1838 72%);padding-inline:16px;}
#travelCard{width:min(100%,640px);max-height:90vh;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;color:#FFFBF2;touch-action:pan-y;padding-block:16px;}
#travelCard h2{margin:0;font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance;}
#travelCard p{margin:0;font-size:16px;opacity:.88;}
#tvWorlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
#tvWorlds .wc{color:var(--ink);}
#travelCard .mb{color:var(--ink);}
#codeBox{display:flex;flex-direction:column;gap:8px;}
#codeTxt{width:100%;box-sizing:border-box;min-height:96px;font:12px ui-monospace,Menlo,monospace;border:2px solid #DCCCAB;border-radius:12px;padding:8px;-webkit-user-select:text;user-select:text;touch-action:auto;background:#fff;color:var(--ink);resize:vertical;}
#stPanel{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);z-index:6;width:min(calc(100% - 32px),460px);box-sizing:border-box;
  background:var(--tray-solid);border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(20,40,60,.25);}
#stPanel .stIc{width:52px;height:52px;border-radius:50%;background:#1E5AA8;display:grid;place-items:center;flex:0 0 auto;}
#stPanel .stIc svg{width:32px;height:32px;}
#stPanel .stTx{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px;}
#stPanel .stTx b{font-size:19px;font-weight:700;line-height:1.15;}
#stPanel .stTx span{font-size:14px;color:#4A5563;line-height:1.3;}
#stPanel .stBtns{display:flex;gap:8px;flex:1 1 100%;}
#stPanel .stBtns .pill{flex:1 1 0;justify-content:center;height:56px;padding:0 14px;font-size:17px;}
#stPanel .stBtns .pill[hidden]{display:none!important;}
#aqPanel{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);z-index:6;width:min(calc(100% - 32px),480px);box-sizing:border-box;
  background:var(--tray-solid);border-radius:24px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(20,40,60,.25);}
#aqPanel .stIc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;}
#aqPanel .stIc svg{width:32px;height:32px;}
#aqPanel .stTx{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px;}
#aqPanel .stTx b{font-size:19px;font-weight:700;line-height:1.15;}
#aqPanel .stTx span{font-size:14px;color:#4A5563;line-height:1.3;}
#aqPanel{cursor:pointer;transition:width .25s,padding .25s;}
#aqMini{display:none;font-size:16px;font-weight:700;padding-right:6px;}
#aqPanel.mini{width:auto;padding:6px;border-radius:40px;gap:8px;}
#aqPanel.mini .stTx,#aqPanel.mini #aqList{display:none;}
#aqPanel.mini #aqMini{display:block;}
#aqPanel.mini .stIc{width:44px;height:44px;}
#aqList{display:flex;gap:8px;flex:1 1 100%;flex-wrap:wrap;}
#aqList:empty{display:none;}
.aqF{display:flex;align-items:center;gap:6px;background:#E6F5FA;border-radius:16px;padding:4px 12px 4px 4px;font-size:14px;}
.aqF img{width:44px;height:44px;border-radius:50%;background:#fff;}
.aqF b{font-variant-numeric:tabular-nums;}
#catch{position:fixed;inset:0;z-index:11;display:grid;place-items:center;background:rgba(10,30,60,.45);padding-inline:16px;}
#catchCard{background:var(--tray-solid);border-radius:28px;padding:20px;width:min(100%,380px);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .35s ease-out;}
#catchCard img{width:180px;height:180px;max-width:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#E3F4FF,#9CD3F5);}
#catchCard h2{margin:4px 0 0;font-size:24px;font-weight:700;line-height:1.15;text-wrap:balance;}
#catchCard p{margin:0;font-size:15px;color:#4A5563;}
#catchCard #catchSub{font-size:18px;font-weight:600;color:var(--ink);}
#catchCard .mrow{width:100%;margin-top:6px;}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
#items .it.fang .ball{position:relative;overflow:visible;}
#items .it.fang .ball img{border-radius:50%;}
#items .it.fang.none .ball img{filter:brightness(0);opacity:.28;}
#items .it.fang .cnt{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:12px;background:var(--sun);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 4px rgba(0,0,0,.15);}
#items .it.fang small{font-size:10.5px;font-weight:500;color:#6A7280;margin-top:-3px;font-variant-numeric:tabular-nums;}
#items .fangsum{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;margin-left:4px;border-left:2px dashed #DCCCAB;align-self:center;height:60px;}
#items .fangsum b{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;}
#items .fangsum span{font-size:12px;line-height:1.2;color:#4A5563;font-weight:600;}
#fade{position:fixed;inset:0;z-index:7;background:#0b4a72;opacity:0;pointer-events:none;transition:opacity .35s;}
#fade.on{opacity:.85;transition:none;}
#btnFish.hot{animation:pulse .5s infinite alternate;}
@keyframes pulse{to{transform:scale(1.08);}}
#btnExit.hot{background:var(--sun);box-shadow:inset 0 -4px 0 var(--sun-deep),0 8px 18px rgba(20,40,60,.2);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>


<canvas id="c"></canvas>

<div id="top">
  <button class="rb" id="btnFull" aria-label="Vollbild"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button class="rb" id="btnSave" aria-label="Welt speichern"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.7 4.7 0 0 0 7 18.5z" fill="#CFEAFF"/><path d="m9.2 13.6 2.2 2.2 4-4.2" stroke-width="2.4"/></svg></button>
  <button class="rb" id="btnTime" aria-label="Tag oder Nacht"></button>
  <button class="rb" id="btnRot" aria-label="Welt drehen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V9h-5.5"/></svg></button>
  <button class="rb" id="btnView" aria-label="Ansicht wechseln"></button>
  <button class="rb" id="btnMenu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>
</div>

<div id="inv">
  <div id="cats"></div>
  <div id="row">
    <div id="tools">
      <button class="it" data-id="hand" id="toolHand"><span class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3 9 6M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></span><span>Schauen</span></button>
      <button class="it" data-id="radierer" id="toolErase"><span class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5 21 9l-10 10H6.5L3 15.5z" fill="#F7A8B8"/><path d="M8.5 10.5 14 16M11 20h10"/></svg></span><span>Weg damit</span></button>
    </div>
    <div id="items"></div>
  </div>
</div>

<div id="editTop" hidden>
  <button class="pill hot" id="eDone"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Fertig</button>
  <div class="grp">
    <button class="rb" id="eUndo" aria-label="Rückgängig"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="rb" id="eTemplate" aria-label="Haus-Vorlage"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3.5 21 11" stroke-linecap="round"/><path d="M5.5 9.5V20h13V9.5" fill="#F3EEE3"/><path d="M10 20v-5h4v5" fill="#B98552"/></svg></button>
    <button class="rb" id="eClear" aria-label="Alles abreißen"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13" fill="#F7A8B8"/></svg></button>
  </div>
</div>
<div id="editTray" hidden>
  <div id="row2" style="display:flex;gap:10px;align-items:flex-start">
    <div id="editTools" style="display:flex;gap:8px;padding-right:10px;border-right:2px dashed #DCCCAB;flex:0 0 auto">
      <button class="it" data-id="E_hand"><span class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V9h-5.5"/></svg></span><span>Drehen</span></button>
      <button class="it" data-id="E_radierer"><span class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5 21 9l-10 10H6.5L3 15.5z" fill="#F7A8B8"/><path d="M8.5 10.5 14 16M11 20h10"/></svg></span><span>Abbauen</span></button>
    </div>
    <div id="editItems"></div>
  </div>

function bake(group){

function railTrack(g,dirs){

function groundModel(type,conn){
  const g=new THREE.Group(); g.userData.cols=[]; g.userData.lights=[];
  const water=()=>mesh(BX(TILE,.03,TILE),waterMat,0,0,0,g,false);
  if(type==='wasser'){water();return g;}
  if(type==='meer'){mesh(BX(TILE,.03,TILE),seaMat,0,0,0,g,false);return g;}
  if(type==='anleger'){water();anlegerBits(g,conn);return g;}
  if(type==='seetor'){water();seetorBits(g,conn);return g;}
  if(type==='schiene'){railTrack(g,conn.rail||[]);return g;}
  if(type==='bahnhof'){const rl=conn.rail||[];if(rl.length>=2)railTrack(g,rl);else railTrack(g,stationAxis(rl)?[1,3]:[0,2]);stationBits(g,conn);return g;}
  if(type==='uebergang'){crossingBits(g,conn);return g;}
  if(type==='tunnel'){tunnelBits(g,conn);return g;}
  const col=type==='gras'?(conn.alt?'#73C24F':'#6BBA47'):type==='sand'?'#EAD08D':'#3D434B';
  box(g,col,TILE,.4,TILE,0,-.2,0,false);
  if(type==='strasse'){
    const h=TILE/2;
    for(let d=0;d<4;d++){
      if(conn.dirs.includes(d)){
        for(const s of [.6,1.5]){ if(d%2) box(g,'#F4F4F2',.5,.02,.12,DIRS[d][0]*s,.01,0,false); else box(g,'#F4F4F2',.12,.02,.5,0,.01,DIRS[d][1]*s,false); }

      }
    }
  }
  return g;
}

function hornNote(a,out,f,t0,dur,vol){
  const g=a.createGain(),lp=a.createBiquadFilter(),bp=a.createBiquadFilter();

  g.gain.setValueAtTime(vol,t0+dur-.08);g.gain.linearRampToValueAtTime(0,t0+dur+.06);
  g.connect(lp);lp.connect(bp);bp.connect(out);

    const o=a.createOscillator(),og=a.createGain();o.type=type;
    o.frequency.setValueAtTime(f*m*.95,t0);o.frequency.exponentialRampToValueAtTime(f*m,t0+.07);

}

function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function encodeWorld(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return 'KUNOWELT1:'+b64(new Uint8Array(await new Response(st).arrayBuffer()));}catch(e){}}
  return 'KUNOWELT0:'+b64(bytes);
}
async function decodeWorld(code){
  const m=String(code).replace(/\s+/g,'').match(/^KUNOWELT([01]):([A-Za-z0-9+/=]+)$/);if(!m)throw new Error('format');
  let u=unb64(m[2]);
  if(m[1]==='1'){if(!window.DecompressionStream)throw new Error('gzip');const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));u=new Uint8Array(await new Response(st).arrayBuffer());}
  return JSON.parse(new TextDecoder().decode(u));
}

function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,600);dirty=false;worldDirty=true;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){}}
function serialize(){
  return {v:1,n:N,dayT,
    tiles:tiles.map(t=>t.o?(t.o.b?[t.g,t.o.t,t.o.r,t.o.s,t.o.b]:[t.g,t.o.t,t.o.r,t.o.s]):[t.g]),
    cars:cars.map(c=>[c.type,+c.x.toFixed(2),+c.z.toFixed(2),+c.h.toFixed(3),c.mode==='park'?0:1]),
    animals:animals.map(a=>[a.type,+a.x.toFixed(2),+a.z.toFixed(2)]),
    fish:fishes.filter(f=>f.free).map(f=>[f.type,+f.x.toFixed(2),+f.z.toFixed(2)]),
    trains:trains.map(t=>[t.type,t.i,t.j,t.dIn]),
    ferries:ferries.map(f=>[+f.x.toFixed(2),+f.z.toFixed(2),+f.h.toFixed(3)])};
}
function load(){
  let d=null; try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){d=null;}
  return applyData(d);
}
function applyData(d){
  if(!d||!Array.isArray(d.tiles))return false;
  const n=Math.round(Math.sqrt(d.tiles.length));
  if(n*n!==d.tiles.length||n<10||n>MAX_N)return false;
  resetTiles(n);
  d.tiles.forEach((t,k)=>{const g=ITEMS[t[0]]&&ITEMS[t[0]].kind==='ground'?t[0]:'gras';tiles[k].g=g;if(t[1]&&MODELS[t[1]]){tiles[k].o={t:t[1],r:t[2]|0,s:t[3]|0};if(typeof t[4]==='string'&&t[4].length===VX*VX*VY)tiles[k].o.b=t[4];}});
  for(let k=0;k<N*N;k++)if(tiles[k].o&&tiles[k].o.t==='aquarium')claimArea(k%N,(k/N)|0,true);
  rebuildAll();
  (d.cars||[]).forEach(c=>{if(ITEMS[c[0]]&&ITEMS[c[0]].kind==='car')addCar(c[0],c[1],c[2],c[3],!!c[4]);});
  (d.animals||[]).forEach(a=>{if(ITEMS[a[0]]&&ITEMS[a[0]].kind==='animal')addAnimal(a[0],a[1],a[2]);});
  (d.trains||[]).forEach(t=>{if(!ITEMS[t[0]]||ITEMS[t[0]].kind!=='train'||!isRail(t[1],t[2]))return;let dd=t[3]|0;
    if(!isRail(t[1]+DIRS[dd][0],t[2]+DIRS[dd][1])){const q=[0,1,2,3].find(q=>isRail(t[1]+DIRS[q][0],t[2]+DIRS[q][1]));if(q==null)return;dd=q;}
    spawnTrain(t[0],t[1],t[2],dd);});
  (d.ferries||[]).forEach(f=>{const tl=tileAt(f[0],f[1]);if(tl&&isWater(tl.i,tl.j)){const fe=spawnFerry(f[0],f[1],f[2]);fe.wait=3;}});
  (d.fish||[]).forEach(f=>{if(FISH[f[0]]&&anyWater(f[1],f[2])){addFish(f[0],f[1],f[2]).free=true;}});
  if(typeof d.dayT==='number')dayT=d.dayT;
  return true;
}
function rebuildAll(){for(let j=0;j<N;j++)for(let i=0;i<N;i++){rebuildGround(i,j);rebuildObj(i,j);}}
function emptyWorld(){resetTiles(START_N);rebuildAll();bc.x=0;bc.z=3;bc.d=48;}

function sampleWorld(){
  resetTiles(START_N);
  const R=(i,j)=>{tiles[I(i,j)].g='strasse';},W=(i,j,g)=>{tiles[I(i,j)].g=g;};
  for(let i=4;i<=15;i++){R(i,4);R(i,14);}
  for(let j=4;j<=14;j++){R(4,j);R(15,j);R(10,j);}

  for(const i of[8,12]){R(i,15);R(i,16);W(i,17,'anleger');}

  W(5,1,'bahnhof');W(13,1,'bahnhof');W(17,1,'tunnel');
  R(10,0);W(10,1,'uebergang');R(10,2);R(10,3);
  const O=(i,j,t)=>{tiles[I(i,j)].o={t,r:ITEMS[t].house?orient(i,j):(i*7+j)%4,s:i*97+j*13+5};};
  [[5,3,'haus'],[7,3,'haus'],[9,3,'villa'],[12,3,'haus'],[14,3,'haus'],[5,5,'haus'],[11,5,'hochhaus'],[13,5,'hochhaus'],
   [14,13,'feuerwache'],[5,13,'villa'],[7,13,'haus'],[8,13,'haus'],[11,13,'haus'],[12,13,'villa'],[16,12,'haus'],[16,6,'villa'],
   [6,7,'baum'],[8,7,'baum'],[6,9,'baum'],[8,9,'baum'],[7,7,'blumen'],[7,8,'blumen'],[6,8,'blumen'],[8,8,'blumen'],[7,9,'blumen'],
   [12,8,'tanne'],[13,10,'tanne'],[11,9,'baum'],[12,10,'blumen'],[13,8,'blumen'],

   [18,2,'berg'],[19,1,'tanne'],[19,3,'tanne'],[18,0,'tanne'],[17,4,'baum'],[18,6,'baum'],[2,8,'baum'],[1,10,'baum'],[1,6,'blumen'],
   [16,15,'tanne'],[19,19,'tanne'],[16,19,'baum'],[19,15,'baum'],[3,6,'laterne'],[3,11,'laterne'],[9,6,'laterne'],[16,10,'laterne'],[9,12,'laterne'],
   [2,13,'baum'],[7,5,'eigen'],[6,5,'garage'],[2,11,'lagerfeuer'],[12,9,'lichterkette'],[6,13,'gartenlampe']
  ].forEach(([i,j,t])=>O(i,j,t));
  rebuildAll();
  {const gc=center(6,5),f=rot(0,1,tiles[I(6,5)].o.r);addCar('lambo',gc.x-f[0]*.3,gc.z-f[1]*.3,Math.atan2(f[0],f[1]),false);}
  spawnTrain('zug',8,1,1);
  {const c=center(4,17);addCar('boot',c.x,c.z-.6,Math.PI/2,false);}
  {const k=I(8,17),dp=dockPose(k),f=spawnFerry(dp.x,dp.z,dp.axis);f.last=k;f.tgt=k;f.wait=8;}
  placeCarOn(7,4,'lambo',1); placeCarOn(15,8,'ferrari',0); placeCarOn(10,10,'polizei',2); placeCarOn(4,12,'bus',0);
  placeCarOn(12,14,'feuerwehrauto',3); placeCarOn(17,9,'lambo',3);
  addAnimal('kuh',70-HALF,66-HALF); addAnimal('kuh',74-HALF,70-HALF); addAnimal('pferd',70-HALF,74-HALF);
  addAnimal('huhn',9-HALF,54-HALF); addAnimal('huhn',10-HALF,52-HALF); addAnimal('huhn',13-HALF,53-HALF); addAnimal('hund',27-HALF,25-HALF);
  bc.x=0; bc.z=3; bc.d=48; bc.yaw=bc.yawT=.55; dayT=.36;
}

/* ---------- Bauwerkstatt ---------- */
const editScene=new THREE.Scene();
const editCam=new THREE.PerspectiveCamera(45,1,.1,200);
editScene.add(new THREE.HemisphereLight(0xffffff,0x88aa77,.72));
const eSun=new THREE.DirectionalLight(0xfff4e0,.8); eSun.position.set(6,11,8); eSun.castShadow=true;
Object.assign(eSun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40}); eSun.shadow.mapSize.set(1024,1024); eSun.shadow.bias=-.0008;
editScene.add(eSun);
const plate=(()=>{
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#6CBA48';x.fillRect(0,0,128,128);x.fillStyle='#5CA43C';
  for(let k=0;k<=8;k++){x.fillRect(k*16-1,0,2,128);x.fillRect(0,k*16-1,128,2);}
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.Mesh(new THREE.BoxGeometry(4,.3,4),[M('#5C9A40'),M('#5C9A40'),new THREE.MeshStandardMaterial({map:t,roughness:.95}),M('#5C9A40'),M('#5C9A40'),M('#5C9A40')]);
  m.position.y=-.15;m.receiveShadow=true;editScene.add(m);return m;
})();
(()=>{
  const ground=new THREE.Mesh(new THREE.CircleGeometry(30,40),M('#A6D98A'));ground.rotation.x=-Math.PI/2;ground.position.y=-.31;ground.receiveShadow=true;editScene.add(ground);
  const road=new THREE.Group();box(road,'#3D434B',9,.3,2.4,0,-.15,3.4,false);
  for(let k=-4;k<=4;k+=1.5)box(road,'#F4F4F2',.7,.02,.12,k,.01,3.4,false);
  box(road,'#C9CCD1',9,.32,.5,0,-.14,2.25,false);
  editScene.add(road);
  const kid=new THREE.Group();
  box(kid,'#3F6FB5',.14,.75,.16,-.09,.375,0);box(kid,'#3F6FB5',.14,.75,.16,.09,.375,0);
  box(kid,'#E4572E',.42,.6,.24,0,1.05,0);box(kid,'#F2C9A0',.26,.28,.26,0,1.5,0);box(kid,'#6B4428',.28,.1,.28,0,1.66,0);
  kid.position.set(-2.9,0,2.3);kid.rotation.y=.4;editScene.add(kid);
})();
const voxGroup=new THREE.Group(); editScene.add(voxGroup);
const ec={yaw:.6,pitch:.5,d:11};
let edit=null,editSel='z';
function placeEditCam(){const cp=Math.cos(ec.pitch);editCam.position.set(Math.sin(ec.yaw)*cp*ec.d,1.5+Math.sin(ec.pitch)*ec.d,Math.cos(ec.yaw)*cp*ec.d);editCam.lookAt(0,1.5,0);}
function refreshVox(){
  while(voxGroup.children.length){const m=voxGroup.children.pop();m.geometry.dispose();}
  const g=meshVoxels(edit.v); [...g.children].forEach(m=>voxGroup.add(m));
}
function openEditor(i,j){
  const t=tiles[I(i,j)],src=(t.o&&t.o.t==='eigen'&&typeof t.o.b==='string')?t.o.b:TEMPLATE;
  edit={i,j,v:src.split(''),undo:[]}; ec.yaw=.6;ec.pitch=.5;ec.d=11;
  refreshVox(); setMode('edit'); selectEdit(editSel); plop();
  hint('Tippe auf den Boden oder an einen Stein, dann wächst dort ein neuer. Ein Finger dreht. Vorne ist die Straße.',6000);
}
function closeEditor(){
  if(!edit)return;
  const {i,j}=edit,t=tiles[I(i,j)],s=edit.v.join('');
  if(/^\.+$/.test(s)){if(t.o&&t.o.t==='eigen'){t.o=null;rebuildObj(i,j);}}
  else{
    if(t.g!=='gras'&&t.g!=='sand')setGround(i,j,'gras');
    const r=(t.o&&t.o.t==='eigen')?t.o.r:orient(i,j);
    for(let k=animals.length-1;k>=0;k--)if(inTile(animals[k],i,j)){const a=animals[k];a.tx=a.x;a.tz=a.z;}
    t.o={t:'eigen',r,s:0,b:s}; rebuildObj(i,j,true);
  }
  const c=center(i,j); bc.x=c.x; bc.z=c.z; bc.d=Math.min(bc.d,30);
  edit=null; setMode('build'); select('hand'); save(); worldDirty=true; plop();
}
function pushUndo(){edit.undo.push(edit.v.join(''));if(edit.undo.length>80)edit.undo.shift();}
function towardCamDir(){const fx=Math.sin(ec.yaw),fz=Math.cos(ec.yaw);let best=0,bv=-9;for(let d=0;d<4;d++){const v=DIRS[d][0]*fx+DIRS[d][1]*fz;if(v>bv){bv=v;best=d;}}return best;}
function removeDoor(x,y,z){
  const st=[[x,y,z]];
  while(st.length){const [a,b,c]=st.pop();if(!vin(a,b,c)||edit.v[VI(a,b,c)]!=='d')continue;edit.v[VI(a,b,c)]='.';st.push([a+1,b,c],[a-1,b,c],[a,b+1,c],[a,b-1,c],[a,b,c+1],[a,b,c-1]);}
}
function placeDoor(t,carve){
  let [x,y,z]=t; if(!vin(x,y,z)){nopeEdit();return;}
  if(carve)while(y>0&&edit.v[VI(x,y-1,z)]!=='.'&&edit.v[VI(x,y-1,z)]!=='d')y--;
  const alongX=Math.abs(Math.cos(ec.yaw))>=Math.abs(Math.sin(ec.yaw));
  let x2=x+(alongX?1:0),z2=z+(alongX?0:1);
  if(!vin(x2,y,z2)){x2=x-(alongX?1:0);z2=z-(alongX?0:1);}
  pushUndo();
  for(let k=0;k<4&&y+k<VY;k++){edit.v[VI(x,y+k,z)]='d';if(vin(x2,y+k,z2))edit.v[VI(x2,y+k,z2)]='d';}
  refreshVox(); tone(300,.12,'triangle',.1,0,1.4);
}
function nopeEdit(){nopeSnd();const b=document.querySelector('#editTray .it.on');if(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');}}
function editTap(cx,cy){
  if(!edit||editSel==='E_hand')return;
  const r=canvas.getBoundingClientRect(),nv=new THREE.Vector2(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  placeEditCam(); editCam.updateMatrixWorld(); voxGroup.updateMatrixWorld(true); plate.updateMatrixWorld();
  ray.setFromCamera(nv,editCam);
  const hits=ray.intersectObjects([...voxGroup.children,plate],false); if(!hits.length)return;
  const h=hits[0],onPlate=h.object===plate,n=h.face?h.face.normal.clone():new THREE.Vector3(0,1,0);
  const cellOf=p=>[Math.floor((p.x-VO)/VB),Math.floor(p.y/VB+1e-4),Math.floor((p.z-VO)/VB)];
  const inside=cellOf(h.point.clone().addScaledVector(n,-.02)),outside=cellOf(h.point.clone().addScaledVector(n,.02));
  if(editSel==='E_radierer'){
    if(onPlate)return; const [x,y,z]=inside; if(!vin(x,y,z)||edit.v[VI(x,y,z)]==='.')return;
    pushUndo(); if(edit.v[VI(x,y,z)]==='d')removeDoor(x,y,z); else edit.v[VI(x,y,z)]='.';
    refreshVox(); tone(240,.08,'square',.06,0,.6); return;
  }
  const code=editSel.slice(2);
  let target=onPlate?[outside[0],0,outside[2]]:outside;
  if(onPlate&&n.y<.5){nopeEdit();return;}
  if(code==='d'){const carve=!onPlate&&Math.abs(n.y)<.5;placeDoor(carve?inside:target,carve);return;}
  const [x,y,z]=target;
  if(!vin(x,y,z)||edit.v[VI(x,y,z)]!=='.'){nopeEdit();return;}
  pushUndo(); edit.v[VI(x,y,z)]=code==='0'?String(towardCamDir()):code; refreshVox(); plop();
}
function selectEdit(id){editSel=id;document.querySelectorAll('#editTray .it').forEach(b=>b.classList.toggle('on',b.dataset.id===id));}
function renderEditTray(){
  const el=$('#editItems'); el.innerHTML='';
  for(const bl of BLOCKS){
    const id='B_'+bl.c,b=document.createElement('button'); b.className='it'+(editSel===id?' on':''); b.dataset.id=id;
    b.innerHTML=`<span class="ball">${thumbs[id]?`<img alt="" src="${thumbs[id]}">`:''}</span><span>${bl.label}</span>`;
    b.addEventListener('click',()=>{ac();plop();selectEdit(id);if(bl.c==='0')hint('Die Schräge fällt immer zu dir hin ab. Dreh dich um das Haus für die andere Seite.',4500);if(bl.c==='d')hint('Tippe auf eine Wand. Die Tür wird dort hineingebaut.',3500);});
    el.appendChild(b);
  }
}
editSel='B_z';
document.querySelectorAll('#editTools .it').forEach(b=>b.addEventListener('click',()=>{ac();plop();selectEdit(b.dataset.id);}));
$('#eDone').addEventListener('click',()=>{ac();closeEditor();});
$('#eUndo').addEventListener('click',()=>{ac();if(edit&&edit.undo.length){edit.v=edit.undo.pop().split('');refreshVox();tone(500,.08,'sine',.1,0,.7);}else nopeSnd();});
$('#eTemplate').addEventListener('click',()=>{ac();if(!edit)return;pushUndo();edit.v=TEMPLATE.split('');refreshVox();plop();});
$('#eClear').addEventListener('click',()=>{ac();if(!edit)return;pushUndo();edit.v=new Array(VX*VX*VY).fill('.');refreshVox();tone(200,.25,'sawtooth',.06,0,.5);hint('Alles weg. Mit dem Pfeil oben holst du es zurück.',3000);});

/* ---------- Schleife ---------- */
function resize(){
  const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false);
  buildCam.aspect=walkCam.aspect=editCam.aspect=w/h; buildCam.updateProjectionMatrix(); walkCam.updateProjectionMatrix(); editCam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
const perf={acc:0,n:0,cool:3000,raised:false};
const focus=new THREE.Vector3(); let last=performance.now(),blink=0,autoSave=0,slotSave=0;
function frame(now){
  const raw=now-last,dt=Math.min(.05,raw/1000); last=now;
  if(raw>0&&raw<250){perf.acc+=raw;perf.n++;}
  perf.cool-=raw;
  if(perf.n>=50){const avg=perf.acc/perf.n;perf.acc=perf.n=0;
    if(perf.cool<=0&&mode!=='edit'){
      if(avg>23&&dpr>1){if(perf.raised)dprLock=true;dpr=Math.max(1,+(dpr-.25).toFixed(2));perf.raised=false;renderer.setPixelRatio(dpr);resize();perf.cool=2500;}
      else if(avg<18&&dpr<dprMax&&!dprLock){dpr=Math.min(dprMax,+(dpr+.25).toFixed(2));perf.raised=true;renderer.setPixelRatio(dpr);resize();perf.cool=5000;}
      else perf.raised=false;
    }}
  if(mode==='build'||mode==='edit')placeBuildCam(); else if(!traveling){if(mode==='walk')updateWalk(dt); else if(mode==='drive')updateDrive(dt);}
  if(mode==='build'||mode==='edit')focus.set(bc.x,0,bc.z); else if(mode==='walk')focus.set(pl.x,0,pl.z); else if(mode==='drive'&&driveCar)focus.set(driveCar.x,0,driveCar.z); else if(mode==='ride'&&rideTrain)focus.set(rideTrain.x,0,rideTrain.z);
  const night=updateDay(dt,focus);
  updateLights(dt,night); updateGarages(dt);
  if(!traveling){
    updateTrains(dt);
    for(const f of ferries.slice())updateFerry(f,dt);
    updateFish(dt); updateWhales(dt); updateFishing(dt);
    for(const c of cars)if(c.mode==='ai')updateCarAI(c,dt);
    for(const a of animals)updateAnimal(a,dt);
  }
  updateCrossings(dt);
  if(mode==='ride')updateRide(dt);
  updateStationUI(); updateAquaUI(); updateAquariums(dt);
  portalMat.color.setHSL((now*.00008)%1,.8,.7); portalMat.opacity=.55+.2*Math.sin(now*.003);
  blink+=dt; const on=Math.floor(blink*3)%2===0; polBlue.emissiveIntensity=on?2:.1; polRed.emissiveIntensity=on?.1:2;
  for(let k=pops.length-1;k>=0;k--){const p=pops[k];p.t+=dt*4;const t=Math.min(p.t,1),s=1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2);p.g.scale.setScalar(Math.max(.05,s));if(t>=1){p.g.scale.setScalar(1);pops.splice(k,1);}if(!p.g.matrixAutoUpdate)p.g.updateMatrix();}
  waterMat.color.setHSL(.56,.72,.55+Math.sin(now*.0012)*.03);
  seaTex.offset.set((now*.00002)%1,(now*.000012)%1);
  autoSave+=dt; if(autoSave>8){autoSave=0;save();}
  slotSave+=dt; if(slotSave>60){slotSave=0;if(worldDirty&&curWorld&&mode!=='edit')saveWorld(false,true);}
  if(mode==='edit'){
    placeEditCam(); renderer.setClearColor(0xbfe6ff);
    for(const n of nightMats)n.m.emissiveIntensity=n.base;
    renderer.render(editScene,editCam);
  } else {
    const uw=subUnder();
    if(uw!==wasUnder){wasUnder=uw;const fd=$('#fade');fd.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fd.classList.remove('on')));
      const c=driveCar;if(uw&&c.g.parent===scene){scene.remove(c.g);underScene.add(c.g);}else if(!uw&&c&&c.g.parent===underScene){underScene.remove(c.g);scene.add(c.g);}
      if(!uw&&c&&!c.diving)destroyUnderwater();}
    if(uw){const nt=updateDay.lastNight||0;uHemi.intensity=.95-.6*nt;uSun.intensity=.55-.45*nt;renderer.render(underScene,walkCam);}
    else renderer.render(scene,cam);
  }
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
resize();
if(!load())sampleWorld();
setMode('build');
select('hand');
renderCats(); renderItems();
requestAnimationFrame(frame);
renderEditTray();
setTimeout(()=>{makeThumbs();renderCats();renderItems();renderEditTray();hint('Wähle unten etwas aus und tippe in die Welt. Oben rechts das Männchen: selbst durch die Stadt laufen!',6500);},60);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(worldDirty&&curWorld&&mode!=='edit')saveWorld(false,true);}});
})();
